<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIKYAKU（飛脚）</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>HIKYAKU（飛脚）</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <div>
            <label for="recipient-name">送り先の名前:</label>
            <input type="text" id="recipient-name" name="recipient_name" required>
        </div>
        <div>
            <label for="recipient-email">送り先のメールアドレス:</label>
            <input type="email" id="recipient-email" name="recipient_email" required>
        </div>
        <div id="drop-area">
            <p>ここにファイルをドラッグ＆ドロップするか、クリックして選択してください</p>
            <input id="file-input" type="file" name="file" multiple required style="display: none;">
            <ul id="file-list"></ul>
        </div>
        <button type="submit">アップロード</button>
    </form>
    <script src="/static/js/script.js"></script>
</body>
</html>
